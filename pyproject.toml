[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-api"
version = "0.1.0"
description = "Python surface layer for the multimodal RAG system"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.83.0",
    "protobuf==7.35.1",
]

[tool.setuptools]
package-dir = {"" = "services/python_api/src"}

[tool.setuptools.packages.find]
where = ["services/python_api/src"]
