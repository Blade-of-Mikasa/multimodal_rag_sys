[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-api"
version = "0.1.0"
description = "Python surface layer for the multimodal RAG system"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "asyncmy==0.2.13",
    "fastapi==0.141.1",
    "grpcio==1.83.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "protobuf==7.35.1",
    "SQLAlchemy[asyncio]==2.0.52",
    "uvicorn==0.52.1",
]

[tool.setuptools]
package-dir = {"" = "services/python_api/src"}

[tool.setuptools.packages.find]
where = ["services/python_api/src"]
