[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-api"
version = "0.1.0"
description = "Python surface layer for the multimodal RAG system"
requires-python = ">=3.11"
dependencies = [
    "aiobotocore==3.8.0",
    "aiokafka==0.14.0",
    "aiohttp==3.14.3",
    "alembic==1.19.1",
    "asyncmy==0.2.13",
    "fastapi==0.141.1",
    "grpcio==1.83.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "Pillow==12.3.0",
    "pypdf==6.14.2",
    "protobuf==7.35.1",
    "SQLAlchemy[asyncio]==2.0.52",
    "trafilatura==2.1.0",
    "uvicorn==0.52.1",
]

[project.scripts]
rag-document-worker = "rag_api.documents.worker_main:main"
rag-ingest-worker = "rag_api.ingestion.worker_main:main"
rag-kafka-outbox = "rag_api.kafka.publisher_main:main"

[tool.setuptools]
package-dir = {"" = "services/python_api/src"}

[tool.setuptools.packages.find]
where = ["services/python_api/src"]
